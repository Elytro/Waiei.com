    <script>
        // 初始化AOS动画
        AOS.init({
            duration: 800,
            once: true,
            offset: 100
        });
        
        // 创建粒子背景
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 15;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.width = Math.random() * 10 + 5 + 'px';
                particle.style.height = particle.style.width;
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (Math.random() * 20 + 20) + 's';
                particlesContainer.appendChild(particle);
            }
        }
        
        createParticles();
        
        // 显示公告栏
        setTimeout(() => {
            const announcement = document.getElementById('announcement');
            announcement.classList.add('show');
        }, 1000);
        
        // 关闭公告栏
        function closeAnnouncement() {
            const announcement = document.getElementById('announcement');
            announcement.classList.remove('show');
        }
        
        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    // 滚动到目标位置，考虑公告栏高度
                    const announcementHeight = document.getElementById('announcement').classList.contains('show') 
                        ? document.getElementById('announcement').offsetHeight 
                        : 0;
                    const targetPosition = target.offsetTop - announcementHeight - 20;
                    
                    window.scrollTo({
                        top: targetPosition,
                        behavior: 'smooth'
                    });
                }
            });
        });
        
        // ESC键关闭公告栏
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                const announcement = document.getElementById('announcement');
                if (announcement.classList.contains('show')) {
                    closeAnnouncement();
                }
            }
        });
    </script>
